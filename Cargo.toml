[package]
name = "apollo-edge-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Pingora-based HTTPS gateway with authenticated protobuf control and immutable routing snapshots"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Apollo-Deploy/apollo-edge-gateway"
keywords = ["gateway", "proxy", "pingora", "https"]
categories = ["network-programming", "web-programming::http-server"]
# Source distribution is separate from a future crates.io release.
publish = false
include = [
    "src/**",
    "proto/**",
    "benches/**",
    "tests/**",
    "docs/**",
    "build.rs",
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "README.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE*",
    "deny.toml",
]

# Do not inherit an enclosing application's workspace or dependency resolution.
[workspace]
resolver = "3"

[dependencies]
anyhow = "=1.0.104"
arc-swap = "=1.9.2"
async-trait = "=0.1.92"
bytes = "=1.12.1"
openssl = "=0.10.81"
pingora = { version = "=0.9.0", features = ["openssl", "lb"] }
prost = "=0.13.5"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-openssl = "=0.6.5"
zeroize = "=1.9.0"

[build-dependencies]
prost-build = "=0.13.5"

[features]
bench-allocations = []

[dev-dependencies]
stats_alloc = "=0.1.10"
tempfile = "=3.27.0"

[[bench]]
name = "hot_paths"
harness = false

[[bench]]
name = "layouts"
harness = false

[profile.release]
lto = "thin"
strip = true
